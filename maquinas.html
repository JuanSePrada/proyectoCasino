<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CasinoAPP - Maquinas</title>
    <link rel="stylesheet" href="css/style_maquinas.css">
    <script type="importmap">
      {
        "imports": {
          "@google/generative-ai": "https://esm.run/@google/generative-ai"
        }
      }
    </script>
</head>

<body>

    <header class="navbar">

        <nav class="nav-menu">
            <button class="nav-btn active" data-target="maquinas.html">Maquinaria</button>
            <button class="nav-btn" data-target="alimentos.html">Alimentos & Bebidas</button>
            <button class="nav-btn" data-target="clientes.html">Clientes</button>
            <button class="nav-btn" data-target="intercambiomonedas.html">Cambio Moneda/Cliente</button>
        </nav>

    </header>

    <h1>Panel de Máquinas</h1>

    <div class="controls-card">
        <button id="btnConsultar">Cargar Datos</button>
        <input type="text" id="txtPregunta" placeholder="Hazle una pregunta a Gemini sobre los datos..." disabled>
        <button id="btnAnalizar" disabled>Analizar con IA</button>
    </div>

    <div class="table-wrapper">
        <table id="dataTable">
            <thead>
                <tr>
                    <th>Máquina</th>
                    <th>Monedas</th>
                    <th>Juegos</th>
                    <th>Premios</th>
                </tr>
            </thead>
            <tbody id="tableBody">
            </tbody>
        </table>
    </div>

    <div id="respuestaText" style="display:none;">
        <h3>✨ Análisis Inteligente</h3>
        <p id="responseText"></p>
    </div>

    <script type="module" src="scripts/maquinas.js"></script>
</body>

</html>
