<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style_alimentos.css">
    <title>CasinoAPP - Alimentos</title>
    <script type="importmap">
      {
        "imports": {
          "@google/generative-ai": "https://esm.run/@google/generative-ai"
        }
      }
    </script>
</head>

<body>

    <header class="navbar">

        <nav class="nav-menu">
            <button class="nav-btn" data-target="maquinas.html">Maquinaria</button>
            <button class="nav-btn active" data-target="alimentos.html">Alimentos & Bebidas</button>
            <button class="nav-btn" data-target="clientes.html">Clientes</button>
            <button class="nav-btn" data-target="intercambiomonedas.html">Cambio Moneda/Cliente</button>
        </nav>

    </header>

    <h1>Panel de Alimentos</h1>

    <div class="controls-container">
        <button id="btnConsultar">Cargar Datos</button>
        <input type="text" id="txtPregunta" placeholder="¿Cuál es el producto más vendido?" disabled>
        <button id="btnAnalizar" disabled>Analizar con Gemini</button>
    </div>

    <div class="table-wrapper">
        <table id="dataTable">
            <thead>
                <tr>
                    <th>Nombre</th>
                    <th>Stock</th>
                    <th>Ventas</th>
                    <th>Valor Unitario</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>

    <div id="respuestaText" style="display:none;">
        <h3>✨ Análisis de Gemini:</h3>
        <p id="responseText"></p>
    </div>

    <script type="module" src="scripts/alimentos.js"></script>

</body>

</html>
