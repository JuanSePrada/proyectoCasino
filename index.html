<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoTicket Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="lang-header">
        <img src="images/Mapa mundo.png" alt="Icono Mundo" class="world-icon">
        <span>Español</span>
        <span>↓</span>
    </div>

    <div class="login-card">
        <div class="logo-container">
            <img src="images/logo 1.png" alt="GoTicket" class="main-logo">
            <p class="tagline">A un click de la Euforia</p>
        </div>

        <div class="input-container">
            <input type="text" id="username" placeholder="Usuario" required>
        </div>

        <div class="input-container">
            <input type="password" id="password" placeholder="Contraseña" required>
        </div>

        <button id="btnIngresar">Ingresar</button>

        <div id="resultados"></div>
    </div>

    <script src="scripts/index.js"></script>
</body>
</html>
